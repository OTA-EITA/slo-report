name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.6.1

  promtool:
    # Validates the generated rules with Prometheus itself and runs promtool
    # unit tests proving the burn rate alerts fire during an outage and stay
    # silent for a healthy service.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install promtool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R prometheus/prometheus --json tagName -q .tagName)
          ver=${tag#v}
          gh release download "$tag" -R prometheus/prometheus -p "prometheus-${ver}.linux-amd64.tar.gz"
          tar -xzf "prometheus-${ver}.linux-amd64.tar.gz" --strip-components=1 "prometheus-${ver}.linux-amd64/promtool"
          ./promtool --version
      - run: ./promtool check rules examples/rules.yaml
      - run: ./promtool test rules examples/rules_test.yaml

  e2e:
    # Imports synthetic traffic into a real VictoriaMetrics and checks the report.
    runs-on: ubuntu-latest
    needs: test
    services:
      victoriametrics:
        image: victoriametrics/victoria-metrics:latest
        ports:
          - 8428:8428
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: make build
      - name: Wait for VictoriaMetrics
        run: |
          for _ in $(seq 30); do curl -sf http://localhost:8428/health && exit 0; sleep 2; done
          exit 1
      - run: e2e/run.sh

  gha-guard:
    # Audits this repository's workflows with https://github.com/OTA-EITA/gha-guard.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: OTA-EITA/gha-guard@647404df7b2c96877a2043a92e09382a1ee1dde9 # v0.1.2
        id: guard
        with:
          fail-on: low
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: ${{ steps.guard.outputs.sarif-file }}
          category: gha-guard
